<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>72lib Portal</title>
    <meta name="description" content="A portal linking to deployed apps.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <!-- Hero Section -->
        <section class="hero-band-marketing">
            <div class="container hero-container">
                <h1 class="heading-2 section-title">72lib デプロイまとめ</h1>
                <p class="subtitle">何か</p>
            </div>
        </section>

        <!-- Applications Grid -->
        <section id="apps" class="section-container">
            <div class="container">
                <h2 class="heading-2 section-title">Deployed Applications</h2>
                <div class="feature-grid">

                    <!-- Pastel Yellow Card -->
                    <a href="https://gif-converter.72lib.dev/" class="card-feature card-feature-yellow hover-lift">
                        <div class="badge-tag-yellow">App</div>
                        <h3 class="heading-3">GIF Converter</h3>
                        <p class="body-md">twitterの動画/gifのURLから mp4/gifに変換します。</p>
                        <div class="card-footer">
                            <span class="button-link">Open &rarr;</span>
                        </div>
                    </a>

                    <!-- Pastel Teal Card -->
                    <a href="https://mycord.72lib.dev" class="card-feature card-feature-teal hover-lift">
                        <div class="badge-tag-teal">App</div>
                        <h3 class="heading-3">Mycord</h3>
                        <p class="body-md">個人用Discord風メモアプリ。管理者の手動ユーザ登録が必要です。</p>
                        <div class="card-footer">
                            <span class="button-link">Open &rarr;</span>
                        </div>
                    </a>

                    <!-- Pastel Coral Card -->
                    <a href="https://blog.72lib.dev" class="card-feature card-feature-coral hover-lift">
                        <div class="badge-tag-coral">Dummy</div>
                        <h3 class="heading-3">Dummy</h3>
                        <p class="body-md">Dummy</p>
                        <div class="card-footer">
                            <span class="button-link">Dummy &rarr;</span>
                        </div>
                    </a>

                    <!-- Pastel Rose Card -->
                    <a href="https://admin.72lib.dev" class="card-feature card-feature-rose hover-lift">
                        <div class="badge-tag-rose">Dummy</div>
                        <h3 class="heading-3">Dummy</h3>
                        <p class="body-md">Dummy</p>
                        <div class="card-footer">
                            <span class="button-link">Dummy &rarr;</span>
                        </div>
                    </a>

                </div>
            </div>
        </section>
    </main>

    <!-- Footer Region -->
    <footer class="footer-region">
        <div class="container footer-bottom">
            <p class="micro">© 2026 72lib</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
